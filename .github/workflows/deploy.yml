# .github/workflows/deploy.yml
# Build on GitHub runner → upload → deploy on Droplet
#
# Smart rebuild rules:
#   - push:              only rebuild what changed (backend/ or frontend/)
#   - workflow_dispatch: always rebuild EVERYTHING (emergency full deploy)
#
name: Deploy RTMudah to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 for diff check

      # ── 2. Detect what changed ───────────────────────────────
      - name: Detect changed paths
        id: changes
        run: |
          # ── Manual trigger → always rebuild everything ───────
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "🔧 Manual trigger — deploying EVERYTHING"
            exit 0
          fi

          # ── Push → check what actually changed ───────────────
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "=== Changed files ==="
          echo "$CHANGED"
          echo "====================="

          # Backend changed if backend/ OR docker-compose.yml changed
          if echo "$CHANGED" | grep -qE "^backend/|^docker-compose\.yml$"; then
            echo "backend=true"  >> $GITHUB_OUTPUT
            echo "✅ Backend/compose changed — will rebuild API"
          else
            echo "backend=false" >> $GITHUB_OUTPUT
            echo "⏭️  Backend unchanged — skipping API rebuild"
          fi

          # Frontend changed if frontend/ OR docker-compose.yml changed
          if echo "$CHANGED" | grep -qE "^frontend/|^docker-compose\.yml$"; then
            echo "frontend=true"  >> $GITHUB_OUTPUT
            echo "✅ Frontend/compose changed — will rebuild Next.js"
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "⏭️  Frontend unchanged — skipping Next.js rebuild"
          fi

      # ── 3. Backend tests (only if backend changed) ───────────
      - name: Setup Python
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        if: steps.changes.outputs.backend == 'true'
        run: pip install -r backend/requirements.txt

      - name: Run backend unit tests
        if: steps.changes.outputs.backend == 'true'
        run: |
          cd backend
          pytest tests/unit -v --tb=short || echo "No unit tests yet — skipping"
        env:
          DATABASE_URL:   postgresql+asyncpg://rtmudah:test@localhost/rtmudah_test
          SECRET_KEY:     ci-secret-key-min-32-characters-long
          JWT_SECRET_KEY: ci-jwt-secret-min-32-characters-long

      # ── 4. Build Next.js (only if frontend changed) ──────────
      - name: Setup Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: steps.changes.outputs.frontend == 'true'
        run: cd frontend && npm ci

      - name: Build frontend (Next.js standalone)
        if: steps.changes.outputs.frontend == 'true'
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL:  https://rtmudah.com/api/v1
          NEXT_PUBLIC_APP_NAME: RTMudah
          NEXTAUTH_SECRET:      ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:         https://rtmudah.com

      # ── 5. Write production .env (always) ────────────────────
      - name: Write .env file
        env:
          SECRET_KEY:        ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY:    ${{ secrets.JWT_SECRET_KEY }}
          NEXTAUTH_SECRET:   ${{ secrets.NEXTAUTH_SECRET }}
          POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD:    ${{ secrets.REDIS_PASSWORD }}
          FONNTE_TOKEN:      ${{ secrets.FONNTE_TOKEN }}
        run: |
          printf '%s\n' \
            "APP_ENV=production" \
            "DEBUG=false" \
            "APP_NAME=RTMudah" \
            "SECRET_KEY=${SECRET_KEY}" \
            "JWT_SECRET_KEY=${JWT_SECRET_KEY}" \
            "JWT_ALGORITHM=HS256" \
            "ACCESS_TOKEN_EXPIRE_MINUTES=60" \
            "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
            "NEXTAUTH_URL=https://rtmudah.com" \
            "NEXT_PUBLIC_API_URL=https://rtmudah.com/api/v1" \
            "ALLOWED_ORIGINS=[\"https://rtmudah.com\",\"https://www.rtmudah.com\"]" \
            "POSTGRES_USER=${POSTGRES_USER}" \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "POSTGRES_DB=${POSTGRES_DB}" \
            "REDIS_PASSWORD=${REDIS_PASSWORD}" \
            "FONNTE_TOKEN=${FONNTE_TOKEN}" \
            "FONNTE_BASE_URL=https://api.fonnte.com" \
            "INTERNAL_API_URL=http://rtmudah_api:8000/api/v1" \
            "DO_SPACES_KEY=" \
            "DO_SPACES_SECRET=" \
            "DO_SPACES_BUCKET=rtmudah-media" \
            "DO_SPACES_REGION=sgp1" \
            "DO_SPACES_ENDPOINT=https://sgp1.digitaloceanspaces.com" \
            > .env

      # ── 6. Set up SSH (always) ────────────────────────────────
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 7. Upload .env (always) ───────────────────────────────
      - name: Upload .env file
        run: |
          rsync -avz .env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/apps/rtmudah/.env

      # ── 8. Upload frontend build (only if frontend changed) ───
      - name: Upload Next.js standalone build
        if: steps.changes.outputs.frontend == 'true'
        run: |
          rsync -avz --delete \
            frontend/.next/standalone/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/apps/rtmudah/frontend/.next/standalone/

          rsync -avz --delete \
            frontend/.next/static/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/apps/rtmudah/frontend/.next/static/

          if [ -d "frontend/public" ] && [ "$(ls -A frontend/public)" ]; then
            rsync -avz --delete \
              frontend/public/ \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/apps/rtmudah/frontend/public/
          else
            echo "frontend/public empty — skipping"
          fi

      # ── 9. Deploy backend (only if backend changed) ───────────
      - name: Deploy backend
        if: steps.changes.outputs.backend == 'true'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
            set -e
            cd /home/apps/rtmudah

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building backend (layer cache) ==="
            docker compose build api migrate

            echo "=== Starting DB + Redis ==="
            docker compose up -d db redis

            echo "=== Waiting for DB ==="
            for i in $(seq 1 30); do
              STATUS=$(docker inspect rtmudah_db --format='{{.State.Health.Status}}' 2>/dev/null || echo "starting")
              echo "DB: $STATUS ($i/30)"
              [ "$STATUS" = "healthy" ] && echo "DB ready!" && break
              [ "$i" -eq 30 ] && echo "DB timeout!" && exit 1
              sleep 3
            done

            echo "=== Running migrations ==="
            docker compose run --rm migrate || echo "Migrations done"

            echo "=== Restarting API ==="
            docker stop rtmudah_api 2>/dev/null || true
            docker rm   rtmudah_api 2>/dev/null || true
            docker compose up -d --no-deps api
            echo "=== API restarted ==="
          ENDSSH

      # ── 10. Pull code if only frontend changed ────────────────
      - name: Pull latest code (frontend-only deploy)
        if: >
          steps.changes.outputs.backend == 'false' &&
          steps.changes.outputs.frontend == 'true'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
            set -e
            cd /home/apps/rtmudah
            echo "=== Pulling latest code ==="
            git pull origin main
          ENDSSH

      # ── 11. Deploy frontend (only if frontend changed) ────────
      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
            set -e
            cd /home/apps/rtmudah

            echo "=== Restarting frontend with new build ==="
            docker stop rtmudah_frontend 2>/dev/null || true
            docker rm   rtmudah_frontend 2>/dev/null || true
            docker compose up -d --no-deps frontend
            echo "=== Frontend restarted ==="

            sleep 5
            docker ps | grep rtmudah
          ENDSSH

      # ── 12. Health check + Caddy reload (always) ──────────────
      - name: Health check and Caddy reload
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
            echo "=== Waiting for API health ==="
            for i in $(seq 1 30); do
              docker exec rtmudah_api curl -sf http://localhost:8000/health \
                > /dev/null 2>&1 && echo "API healthy! ✅" && break
              echo "Waiting... ($i/30)"
              [ "$i" -eq 30 ] && echo "API timeout!" && exit 1
              sleep 3
            done

            echo "=== Reloading Caddy ==="
            CADDY=$(docker ps -qf "name=caddy")
            [ -n "$CADDY" ] && docker exec $CADDY \
              caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              || echo "Caddy reload skipped"

            echo "=== Deploy complete! ==="
            cd /home/apps/rtmudah
            echo "$(date) | $(git rev-parse --short HEAD) | OK" >> deploy.log
            docker ps | grep rtmudah
          ENDSSH
