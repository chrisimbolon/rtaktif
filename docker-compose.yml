# ═══════════════════════════════════════════════════════════════════
# RTMudah — docker-compose.yml
# Fixed: removed init_db.sql mount (was causing "is a directory" error)
# The extensions are created by Alembic migration instead
# ═══════════════════════════════════════════════════════════════════
version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: rtmudah_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-rtmudah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-rtmudah_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # init_db.sql mount removed — was mounting as directory not file
      # Extensions are handled in the Alembic migration instead
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtmudah} -d ${POSTGRES_DB:-rtmudah_db}"]
      interval: 5s
      timeout:  5s
      retries:  10
    networks:
      - rtmudah_internal

  redis:
    image: redis:7-alpine
    container_name: rtmudah_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5
    networks:
      - rtmudah_internal

  migrate:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: rtmudah_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rtmudah}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rtmudah_db}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rtmudah_internal
    restart: "no"

  api:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: rtmudah_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rtmudah}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rtmudah_db}
      REDIS_URL:    redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rtmudah_internal
      - caddy_net
    healthcheck:
      test:         ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 20s

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:  ${NEXT_PUBLIC_API_URL:-https://rtmudah.com/api/v1}
        NEXT_PUBLIC_APP_NAME: RTMudah
    container_name: rtmudah_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXTAUTH_URL:    ${NEXTAUTH_URL:-https://rtmudah.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV:        production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rtmudah_internal
      - caddy_net
    healthcheck:
      test:         ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval:     15s
      timeout:      5s
      retries:      5
      start_period: 40s

volumes:
  pg_data:
  redis_data:

networks:
  rtmudah_internal:
    driver: bridge
    name:   rtmudah_internal
  caddy_net:
    external: true
    name: caddy-net
